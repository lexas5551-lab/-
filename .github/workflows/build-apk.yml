name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check Android startup and storage recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            gradle connectedDebugAndroidTest
            adb pull /sdcard/Download/startup.png startup.png
      - name: Upload startup check
        uses: actions/upload-artifact@v4
        with:
          name: Android-startup-check
          path: |
            startup.png
            app/build/reports/androidTests/connected/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GNVP-GOR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
