rgin:0 0 7px}.empty{text-align:center;color:var(--muted);padding:35px 12px}.source-note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.35}.wide{grid-column:1/-1;min-height:auto}@media(max-width:480px){.screen{padding:11px}.grid{gap:8px}.card{padding:13px;min-height:118px}.qtext{font-size:17px}.otext{font-size:13px}}

</style><link rel="stylesheet" href="modern-ui.css"><link rel="icon" href="app-icon.svg" type="image/svg+xml"></head><body><div id="app" class="app"><div class="topbar"><div class="brand">ГНВП-тест</div></div><div class="screen"><div class="hero"><h1>Загрузка тренажёра…</h1><p>Открываем вопросы и ответы.</p></div></div></div><script>
(function(){
  window.__trainerReady=false;
  function startupError(message){
    var root=document.getElementById('app');
    if(!root)return;
    root.innerHTML='<div class="topbar"><div class="brand">ГНВП-тест</div></div><div class="screen"><div class="hero"><h1>Не удалось открыть тренажёр</h1><p>Закройте приложение и откройте снова. Если ошибка повторится, сообщите текст ниже.</p><pre id="startup-detail" style="white-space:pre-wrap;overflow-wrap:break-word"></pre><button class="primary" onclick="location.reload()">Повторить</button></div></div>';
    document.getElementById('startup-detail').textContent=message;
  }
  window.addEventListener('error',function(e){if(!window.__trainerReady)startupError(e.message||'Ошибка загрузки файлов приложения');});
  window.setTimeout(function(){if(!window.__trainerReady)startupError('Запуск страницы не завершён. Обновите страницу. Если ошибка повторяется, сообщите её текст.');},8000);
})();
</script><script src="questions.js"></script><script>
const $=s=>document.querySelector(s), app=$('#app');
const state={screen:'home'};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const emptyStats=()=>({practiceCorrect:0,practiceWrong:0,tests:0,best:0,wrongIds:[]});
let memoryStats=emptyStats();
function stats(){
  let s=memoryStats;
  try { const raw=localStorage.getItem('trainerStatsV2'); if(raw) s=JSON.parse(raw); } catch(e) {}
  if(!s||typeof s!=='object'||Array.isArray(s))s=emptyStats();
  const safe=emptyStats();
  ['practiceCorrect','practiceWrong','tests','best'].forEach(k=>{if(typeof s[k]==='number'&&isFinite(s[k])&&s[k]>=0)safe[k]=s[k]});
  safe.wrongIds=Array.isArray(s.wrongIds)?s.wrongIds.filter(id=>typeof id==='string'):[];
  memoryStats=safe;
  return safe;
}
function saveStats(s){memoryStats=s;try{localStorage.setItem('trainerStatsV2',JSON.stringify(s))}catch(e){}}
function clearStats(){memoryStats=emptyStats();try{localStorage.removeItem('trainerStatsV2')}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function uiIcon(name){const paths={book:'<path d="M3 5c4-2 6-1 9 1 3-2 5-3 9-1v14c-4-2-6-1-9 1-3-2-5-3-9-1Z"/><path d="M12 6v14"/>',test:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6m-6 4h6m-6 4h3"/>',ticket:'<path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4Z"/><path d="M15 7v3m0 3v3m0 2v1"/>',repeat:'<path d="M20 7v5h-5M4 17v-5h5M19 12a7 7 0 0 0-12-5L4 10m1 2a7 7 0 0 0 12 5l3-3"/>',image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/>',stats:'<path d="M4 21V12h4v9m2 0V6h4v15m2 0V3h4v18"/>'};return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths[name]+'</svg>'}
function openStatistics(){const s=stats(),total=s.practiceCorrect+s.practiceWrong;app.innerHTML=appHeader('Статистика')+`<div class="screen"><div class="hero stat-summary"><h1>Ваши результаты</h1><p>Каждый ответ помогает понять, какие темы нужно повторить.</p></div><div class="stats"><div class="stat"><b>${s.practiceCorrect}</b><span>правильных ответов</span></div><div class="stat"><b>${total?Math.round(s.practiceCorrect/total*100):0}%</b><span>верных попыток в обучении</span></div><div class="stat"><b>${s.tests}</b><span>тестов и билетов</span></div><div class="stat"><b>${s.practiceWrong}</b><span>ошибочных попыток</span></div><div class="stat"><b>${s.wrongIds.length}</b><span>вопросов для повторения</span></div><div class="stat"><b>${s.best}%</b><span>лучший результат теста</span></div></div><p class="stats-description">Статистика хранится в этом браузере. В обучении учитываются все попытки ответа, включая повторные.</p><div class="actions"><button class="primary" onclick="openMistakes()">Повторить ошибки</button><button class="ghost" onclick="resetProgress()">Сбросить прогресс</button></div></div>`}
function setIllustrationZoom(value){const dialog=document.getElementById('image-dialog');if(!dialog||!dialog.open)return;const zoom=Math.max(50,Math.min(400,Math.round(value))),stage=dialog.querySelector('.image-stage'),img=stage.querySelector('img'),previous=Number(dialog.dataset.zoom||100),cx=(stage.scrollLeft+stage.clientWidth/2)/previous,cy=(stage.scrollTop+stage.clientHeight/2)/previous;dialog.dataset.zoom=zoom;const base=stage.clientWidth-(innerWidth<=520?16:32);img.style.width=base*zoom/100+'px';dialog.querySelector('output').textContent=zoom+'%';dialog.querySelector('input').value=zoom;dialog.querySelector('[data-zoom="minus"]').disabled=zoom===50;dialog.querySelector('[data-zoom="plus"]').disabled=zoom===400;if(zoom<=100){stage.scrollLeft=0;stage.scrollTop=0}else{stage.scrollLeft=cx*zoom-stage.clientWidth/2;stage.scrollTop=cy*zoom-stage.clientHeight/2}}
function changeIllustrationZoom(delta){const dialog=document.getElementById('image-dialog');if(dialog)setIllustrationZoom(Number(dialog.dataset.zoom||100)+delta)}
let memoryPractice={answers:{},session:null};
function loadPractice(){let data=memoryPractice;try{const raw=localStorage.getItem('trainerPracticeV1');if(raw)data=JSON.parse(raw)}catch(e){}const safe={answers:{},session:null};if(data&&typeof data==='object'){for(const q of QUESTIONS){const a=data.answers&&data.answers[q.id];if(!a||!Array.isArray(a.selected))continue;const selected=[...new Set(a.selected.filter(id=>q.options.some(o=>o.id===id)))];safe.answers[q.id]={selected,checked:a.checked===true,revealed:a.revealed===true}}const s=data.session;if(s&&Array.isArray(s.ids)){const ids=[...new Set(s.ids.filter(id=>QUESTIONS.some(q=>q.id===id)))];if(ids.length)safe.session={ids,index:Math.max(0,Math.min(ids.length-1,Number.isInteger(s.index)?s.index:0))}}}memoryPractice=safe;return safe}
function savePractice(data){memoryPractice=data;try{localStorage.setItem('trainerPracticeV1',JSON.stringify(data))}catch(e){}}
function savePracticeSession(){if(state.mode!=='practice'||!state.queue||!state.queue.length)return;const data=loadPractice();data.session={ids:state.queue.map(q=>q.id),index:state.index};savePractice(data)}
function rememberPracticeAnswer(checked=false,revealed=false){const q=state.queue[state.index],data=loadPractice();data.answers[q.id]={selected:[...state.currentSelected],checked,revealed};savePractice(data);savePracticeSession()}
function restorePracticeFeedback(){if(state.mode!=='practice')return;const q=state.queue[state.index],a=loadPractice().answers[q.id];if(!a)return;if(a.checked){const ok=sameSet(a.selected,q.correct);markOptions(q,ok);showFeedback(ok?'good':'bad',answerFeedback(q,a.selected,ok));if(ok)$('#visualSlot').innerHTML=visualHtml(q)}else if(a.revealed){document.querySelectorAll('.option').forEach(el=>{if(q.correct.includes(el.dataset.id))el.classList.add('correct')});showFeedback('note',answerFeedback(q,[],false,true));$('#visualSlot').innerHTML=visualHtml(q)}}
function resetPracticeAnswers(){if(!confirm('Сбросить все сохранённые ответы в разделе «Вопросы»? Статистика останется.'))return;memoryPractice={answers:{},session:null};try{localStorage.removeItem('trainerPracticeV1')}catch(e){}state.answers={};openPractice()}
function continuePractice(){const session=loadPractice().session;if(!session){openPractice();return}state.mode='practice';state.answers={};state.queue=session.ids.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);state.index=Math.min(session.index,state.queue.length-1);renderQuestion()}
function movePractice(delta){if(state.mode!=='practice')return;const index=state.index+delta;if(index<0||index>=state.queue.length)return;state.index=index;renderQuestion()}
function appHeader(title,back=true){return `<div class="topbar"><div class="header-row">${back?'<button class="back" aria-label="На главную" onclick="goHome()">‹</button>':''}<img class="brand-logo" src="app-icon.svg" alt=""><div><div class="brand">ГНВП-тест</div><div class="subtitle">${back?esc(title):'Тестирование и обучение'}</div></div><div class="online-badge"><i></i>Работает без интернета</div></div></div>`}
function goHome(){state.screen='home';renderHome()}
function renderHome(){const s=stats();const modes=[['questions','book','Вопросы','Учитесь с пояснениями к ответам','openPractice()'],['test','test','Тест','Проверьте знания на случайных вопросах','openTestSettings()'],['ticket','ticket','Билет','10 случайных вопросов','startTicket()'],['mistakes','repeat','Ошибки','Повторите сложные для вас вопросы','openMistakes()'],['stats','stats','Статистика','Следите за своими результатами','openStatistics()']];app.innerHTML=appHeader('',false)+`<main class="screen"><section class="home-hero"><div class="hero-copy"><span class="eyebrow">ГНВП и ГОР</span><h1>Знания, которые<br>дают уверенность</h1><p>Изучайте вопросы, разбирайте ответы и проверяйте себя в удобном темпе.</p><div class="hero-tags"><span>145 вопросов</span><span>Понятные разъяснения</span><span>Наглядные схемы</span></div></div><div class="hero-art"><img src="images/ready-075.png" alt="Противовыбросовое оборудование"><span>Оборудование и процессы</span></div></section><div class="section-heading"><h2>Выберите режим</h2><span>Подготовка в вашем темпе</span></div><div class="grid home-grid">${modes.map(([color,icon,title,description,action])=>`<button class="mode-card mode-${color}" onclick="${action}"><span class="mode-icon">${uiIcon(icon)}</span><span class="mode-copy"><h3>${title}</h3><p>${description}</p></span><span class="mode-arrow" aria-hidden="true">›</span></button>`).join('')}</div><div class="section-title">Ваш прогресс</div><div class="stats"><div class="stat"><b>${s.practiceCorrect}</b><span>правильных ответов в обучении</span></div><div class="stat"><b>${s.tests}</b><span>пройденных тестов и билетов</span></div><div class="stat"><b>${s.best}%</b><span>лучший результат</span></div></div><p class="home-footer">ГНВП-тест · учитесь, проверяйте себя и возвращайтесь к сложным вопросам</p></main>`}
function resetProgress(){if(confirm('Сбросить статистику и список ошибок?')){clearStats();renderHome()}}
function filterQuestions(f){return f==='ALL'?QUESTIONS:QUESTIONS.filter(q=>q.domain===f)}
function settingsBlock(action,title,practice=false){return appHeader(title)+`<div class="screen"><div class="settings"><label>Раздел</label><select id="filter"><option value="ALL">Все вопросы — ГНВП + ГОР (145)</option><option value="ГНВП">Только ГНВП (120)</option><option value="ГОР">Только ГОР (25)</option></select>${practice?'<label>Порядок</label><select id="order"><option value="SEQ">По порядку</option><option value="RND">Случайно</option></select>':`<label>Количество вопросов</label><select id="count"><option>10</option><option>20</option><option selected>25</option><option>50</option><option>100</option><option>145</option></select>`}<div class="actions"><button class="primary" onclick="${action}">Начать</button></div></div></div>`}
function openPractice(){const data=loadPractice(),count=Object.values(data.answers).filter(a=>a.selected.length).length;app.innerHTML=settingsBlock('startPractice()','Настройки вопросов',true);const panel=$('.settings');panel.innerHTML+=`<div class="practice-save-info"><b>Ответы сохраняются автоматически</b><p>Выбраны ответы на ${count} из ${QUESTIONS.length} вопросов. Можно возвращаться к ним и продолжать после закрытия приложения.</p>${data.session?'<button class="secondary" onclick="continuePractice()">Продолжить с последнего вопроса</button>':''}<div class="practice-reset"><button class="ghost" onclick="resetPracticeAnswers()">Сбросить сохранённые ответы</button><p class="small">Очистит выбранные ответы и разъяснения в разделе «Вопросы». Статистика тестов сохраняется.</p></div></div>`}
function startPractice(ids=null){state.mode='practice';state.index=0;state.answers={};let q;if(ids){q=QUESTIONS.filter(x=>ids.includes(x.id));q=shuffle(q)}else{const f=($('#filter')?$('#filter').value:'ALL');q=filterQuestions(f);if((($('#order')?$('#order').value:'SEQ'))==='RND')q=shuffle(q)}state.queue=q;if(!q.length){app.innerHTML=appHeader('Ошибки')+'<div class="screen"><div class="empty">Ошибок пока нет.</div></div>';return}savePracticeSession();renderQuestion()}
function openMistakes(){startPractice(stats().wrongIds||[])}
function openTestSettings(){app.innerHTML=settingsBlock('startTest()','Тест')}
function startTest(){state.mode='test';state.index=0;state.answers={};const f=$('#filter').value;const pool=filterQuestions(f);const n=Math.min(parseInt($('#count').value),pool.length);state.queue=shuffle(pool).slice(0,n);renderQuestion()}
function startTicket(){state.mode='ticket';state.index=0;state.answers={};state.ticketNo=Math.floor(1000+Math.random()*9000);state.queue=shuffle(QUESTIONS).slice(0,10);renderQuestion()}
function visualHtml(q){return q.image?`<div class="visual"><div class="visual-note">Иллюстрация к вопросу</div><button class="thumbnail" aria-label="Увеличить иллюстрацию к вопросу ${q.number}" onclick="enlargeIllustration('${q.id}')"><img src="${esc(q.image)}" alt="Иллюстрация к вопросу ${q.number}"></button><div class="small">Нажмите на изображение, чтобы приблизить детали.</div></div>`:''}
function enlargeIllustration(id){const q=QUESTIONS.find(q=>q.id===id);if(!q||!q.image)return;let dialog=document.getElementById('image-dialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='image-dialog';dialog.className='image-dialog';document.body.appendChild(dialog);dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});dialog.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='+'||e.key==='='){e.preventDefault();changeIllustrationZoom(25)}else if(e.key==='-'){e.preventDefault();changeIllustrationZoom(-25)}});window.addEventListener('resize',()=>{if(dialog.open)setIllustrationZoom(Number(dialog.dataset.zoom))})}dialog.innerHTML=`<div class="image-toolbar"><b class="image-title" id="image-title">${esc(q.domain)} · Вопрос №${q.number}</b><div class="zoom-controls"><button data-zoom="minus" aria-label="Уменьшить" onclick="changeIllustrationZoom(-25)">−</button><output aria-live="polite">100%</output><button data-zoom="plus" aria-label="Приблизить" onclick="changeIllustrationZoom(25)">+</button><input aria-label="Масштаб иллюстрации" type="range" min="50" max="400" step="25" value="100" oninput="setIllustrationZoom(this.value)"><button class="zoom-reset" onclick="setIllustrationZoom(100)">Сбросить</button></div><button class="close-image" aria-label="Закрыть иллюстрацию" onclick="document.getElementById('image-dialog').close()">×</button></div><div class="image-stage" tabindex="0" aria-label="Область просмотра иллюстрации"><img src="${esc(q.image)}" alt="Иллюстрация к вопросу ${q.number}" draggable="false"></div><div class="image-caption"><p>${esc(q.question)}</p><span>Масштаб: кнопки + и −, ползунок или колесо мыши. Увеличенную схему можно перетаскивать.</span></div>`;dialog.setAttribute('aria-labelledby','image-title');dialog.dataset.zoom=100;dialog.showModal();setIllustrationZoom(100);const stage=dialog.querySelector('.image-stage');stage.addEventListener('wheel',e=>{e.preventDefault();changeIllustrationZoom(e.deltaY<0?25:-25)},{passive:false});let drag=null;stage.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;drag={x:e.clientX,y:e.clientY,left:stage.scrollLeft,top:stage.scrollTop};stage.setPointerCapture(e.pointerId);e.preventDefault()});stage.addEventListener('pointermove',e=>{if(!drag)return;stage.scrollLeft=drag.left-(e.clientX-drag.x);stage.scrollTop=drag.top-(e.clientY-drag.y)});const stop=()=>drag=null;stage.addEventListener('pointerup',stop);stage.addEventListener('pointercancel',stop);stage.addEventListener('lostpointercapture',stop)}
function renderQuestion(){const q=state.queue[state.index];const saved=state.mode==='practice'?loadPractice().answers[q.id]:null;state.currentSelected=new Set(saved?saved.selected:state.answers[q.id]||[]);const pct=state.index/state.queue.length*100,opts=q.options;app.innerHTML=appHeader(state.mode==='practice'?'Вопросы':state.mode==='ticket'?`Билет №${state.ticketNo}`:'Тест')+`<div class="screen"><div class="qmeta"><span>${q.domain} · №${q.number}</span><span>${state.index+1} / ${state.queue.length}</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="qcard"><div class="qtext">${esc(q.question)}</div><div class="small">${q.correct.length>1?'Выберите все правильные варианты.':'Выберите один правильный вариант.'}</div><div id="options">${opts.map(o=>`<div class="option" data-id="${o.id}" onclick="toggleOption('${o.id}')"><span class="badge">${o.id}</span><span class="otext">${esc(o.text)}</span></div>`).join('')}</div><div id="feedback" class="feedback"></div><div id="visualSlot"></div><div class="actions answer-actions"><button class="primary" onclick="submitCurrent()">${state.mode==='practice'?'Проверить':'Сохранить ответ'}</button>${state.mode==='practice'?'<button class="secondary" onclick="showCorrect()">Показать ответ</button>':''}</div>${state.mode==='practice'?`<div class="practice-navigation"><button class="ghost" onclick="movePractice(-1)" ${state.index===0?'disabled':''}>‹ Назад</button><span>Ответ сохраняется автоматически</span><button class="primary" onclick="movePractice(1)" ${state.index===state.queue.length-1?'disabled':''}>Вперёд ›</button></div><div class="practice-settings-link"><button class="secondary" onclick="openPractice()">Настройки вопросов</button></div>`:state.index>0?'<div class="actions"><button class="ghost" onclick="prevQuestion()">Назад</button></div>':''}</div></div>`;paintSelection();restorePracticeFeedback();if(state.mode==='practice')savePracticeSession()}
function toggleOption(id){const q=state.queue[state.index],previous=[...state.currentSelected];if(q.correct.length===1)state.currentSelected=new Set([id]);else state.currentSelected.has(id)?state.currentSelected.delete(id):state.currentSelected.add(id);paintSelection();if(state.mode==='practice'&&!sameSet(previous,[...state.currentSelected])){rememberPracticeAnswer();document.querySelectorAll('.option').forEach(el=>el.classList.remove('correct','wrong'));$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#visualSlot').innerHTML=''}}
function paintSelection(){document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',state.currentSelected.has(el.dataset.id)))}
function sameSet(a,b){a=[...a].sort();b=[...b].sort();return a.length===b.length&&a.every((x,i)=>x===b[i])}
function selectedWrongReason(q,selected){if(q.correct.length>1)return q.wrongExplanation;const id=selected[0];const opt=q.options.find(o=>o.id===id);return (opt&&opt.feedback)||q.wrongExplanation}

function answerFeedback(q,selected,ok,reveal=false){
 const optionText=id=>{const o=q.options.find(o=>o.id===id);return o?esc(o.id+' — '+o.text):''};
 const correct=q.correct.map(optionText).join('<br>');
 let details='';
 if(!ok&&!reveal){
  const extra=selected.filter(id=>!q.correct.includes(id));
  const missing=q.correct.filter(id=>!selected.includes(id));
  if(q.correct.length>1){
   if(extra.length)details+='<div class="answer-detail"><b>Выбрано лишнее:</b><br>'+extra.map(optionText).join('<br>')+'</div>';
   if(missing.length)details+='<div class="answer-detail"><b>Не выбрано:</b><br>'+missing.map(optionText).join('<br>')+'</div>';
  }else details='<div class="answer-detail"><b>Ваш ответ:</b><br>'+selected.map(optionText).join('<br>')+'</div>';
 }
 return '<div class="feedback-title">'+(reveal?'Разъяснение ответа':ok?'Верно':'Ответ неверный')+'</div>'+details+'<div class="answer-detail"><b>Правильный ответ:</b><br>'+correct+'</div><div class="answer-detail"><b>Почему:</b> '+esc(q.correctExplanation)+'</div>'+(!ok&&!reveal?'<div class="retry-note">Выберите ответ ещё раз, чтобы закрепить материал.</div>':'');
}

function showFeedback(kind,txt){const f=$('#feedback');f.className='feedback show '+kind;f.innerHTML=txt}
function markOptions(q,ok){document.querySelectorAll('.option').forEach(el=>{el.classList.remove('correct','wrong');if(ok&&q.correct.includes(el.dataset.id))el.classList.add('correct');if(!ok&&state.currentSelected.has(el.dataset.id))el.classList.add('wrong')})}
function submitCurrent(){const q=state.queue[state.index],selected=[...state.currentSelected];if(!selected.length){showFeedback('note','Выберите вариант ответа.');return}if(state.mode==='practice'){const existing=loadPractice().answers[q.id],ok=sameSet(selected,q.correct);if(!existing||!existing.checked||!sameSet(existing.selected,selected)){const s=stats();if(ok){s.practiceCorrect++;s.wrongIds=(s.wrongIds||[]).filter(id=>id!==q.id)}else{s.practiceWrong++;if(!s.wrongIds.includes(q.id))s.wrongIds.push(q.id)}saveStats(s)}rememberPracticeAnswer(true,false);markOptions(q,ok);showFeedback(ok?'good':'bad',answerFeedback(q,selected,ok));$('#visualSlot').innerHTML=ok?visualHtml(q):'';return}state.answers[q.id]=selected;if(state.index<state.queue.length-1){state.index++;renderQuestion()}else finishExam()}
function showCorrect(){const q=state.queue[state.index];document.querySelectorAll('.option').forEach(el=>{el.classList.remove('wrong');if(q.correct.includes(el.dataset.id))el.classList.add('correct')});showFeedback('note',answerFeedback(q,[],false,true));$('#visualSlot').innerHTML=visualHtml(q);if(state.mode==='practice')rememberPracticeAnswer(false,true)}
function nextPractice(){movePractice(1)}
function prevQuestion(){if(state.mode==='practice'){movePractice(-1);return}if(state.index>0){state.index--;renderQuestion()}}
function finishExam(){let correct=0,wrong=[];state.queue.forEach(q=>{const a=state.answers[q.id]||[];if(sameSet(a,q.correct))correct++;else wrong.push({q,a})});const pct=Math.round(correct/state.queue.length*100);let s=stats();s.tests++;s.best=Math.max(s.best||0,pct);wrong.forEach(x=>{if(!s.wrongIds.includes(x.q.id))s.wrongIds.push(x.q.id)});saveStats(s);app.innerHTML=appHeader(state.mode==='ticket'?`Билет №${state.ticketNo}`:'Результат')+`<div class="screen"><div class="result"><div class="score">${pct}%</div><h2>${correct} из ${state.queue.length}</h2><div class="actions"><button class="primary" onclick="${state.mode==='ticket'?'startTicket()':'openTestSettings()'}">${state.mode==='ticket'?'Новый билет':'Новый тест'}</button><button class="secondary" onclick="goHome()">На главную</button></div></div>${wrong.length?`<div class="section-title">Разбор ошибок</div>${wrong.map(reviewHtml).join('')}`:'<div class="hero" style="margin-top:13px"><b>Ошибок нет.</b></div>'}</div>`}
function reviewHtml(x){const q=x.q,chosen=x.a.map(id=>q.options.find(o=>o.id===id)).filter(Boolean),corr=q.correct.map(id=>q.options.find(o=>o.id===id)).filter(Boolean);return `<div class="review-item"><span class="pill">${q.domain} · №${q.number}</span><b style="display:block;margin-top:6px">${esc(q.question)}</b><div class="small"><b>Ваш ответ:</b> ${chosen.length?chosen.map(o=>o.id+' — '+esc(o.text)).join('; '):'нет ответа'}</div><div class="small"><b>Правильно:</b> ${corr.map(o=>o.id+' — '+esc(o.text)).join('; ')}</div><div class="small" style="margin-top:5px"><b>Почему:</b> ${esc(q.correctExplanation)}</div>${visualHtml(q)}</div>`}
renderHome();
window.__trainerReady=true;
</script></body></html>
