<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f62"><title>ГНВП и ГОР</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--text:#15232d;--muted:#687985;--blue:#123f62;--blue2:#147bea;--green:#07963a;--red:#d71920;--line:#d9e2e8;--amber:#b76d00;--shadow:0 7px 24px rgba(13,38,54,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.app{max-width:780px;margin:auto;min-height:100vh;padding-bottom:30px}.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0f3857,var(--blue));color:#fff;padding:14px 16px;box-shadow:0 2px 11px rgba(0,0,0,.17)}.brand{font-size:20px;font-weight:850}.subtitle{font-size:12px;opacity:.85;margin-top:2px}.screen{padding:14px}.hero,.card,.settings,.qcard,.result,.review-item{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.hero{border-radius:18px;padding:17px;margin-bottom:13px;background:linear-gradient(135deg,#fff,#edf6fb)}.hero h1{margin:0 0 7px;font-size:23px}.hero p{margin:0;color:var(--muted);line-height:1.4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border-radius:16px;padding:15px;cursor:pointer;min-height:126px}.card h3{margin:7px 0 4px}.card p{font-size:13px;color:var(--muted);line-height:1.35;margin:0}.icon{font-size:27px}.section-title{font-weight:850;margin:16px 0 9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}.stat b{font-size:19px;display:block}.stat span{font-size:11px;color:var(--muted)}button{border:0;border-radius:12px;padding:12px 13px;font-size:14px;font-weight:800;cursor:pointer}.primary{background:var(--blue2);color:#fff}.secondary{background:#e7f0f7;color:var(--blue)}.ghost{background:#fff;border:1px solid var(--line)}.back{background:transparent;color:#fff;padding:0;margin-right:10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.settings{border-radius:16px;padding:16px}label{font-size:13px;font-weight:800;display:block;margin:12px 0 5px}select{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd7df;background:#fff;font-size:15px}.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.progress{height:7px;background:#dce5ea;border-radius:99px;overflow:hidden;margin:9px 0 13px}.bar{height:100%;background:var(--blue2)}.qcard{border-radius:18px;padding:16px}.qtext{font-size:18px;font-weight:850;line-height:1.36;margin-bottom:13px}.small{font-size:12px;color:var(--muted);line-height:1.38}.option{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid #d7e0e6;border-radius:12px;margin:8px 0;background:#fff;cursor:pointer}.option.selected{border-color:var(--blue2);background:#edf6ff}.option.correct{border-color:#42ad66;background:#eaf8ef}.option.wrong{border-color:#e78b8b;background:#fff0f0}.badge{min-width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#eef2f4;font-weight:850}.option.selected .badge{background:var(--blue2);color:#fff}.otext{font-size:14px;line-height:1.38}.feedback{margin-top:12px;border-radius:12px;padding:12px;line-height:1.42;display:none}.feedback.show{display:block}.feedback.good{background:#e7f7ec;color:#075d2b;border:1px solid #a6d9b8}.feedback.bad{background:#fff0f0;color:#991b1b;border:1px solid #ebb0b0}.feedback.note{background:#fff7e5;color:#7a4d00;border:1px solid #edd19a}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1}.result{border-radius:18px;padding:18px;text-align:center}.score{font-size:44px;font-weight:900;color:var(--blue2)}.review-item{border-radius:13px;padding:12px;margin:9px 0;text-align:left}.pill{display:inline-block;border-radius:99px;padding:4px 8px;background:#eaf2f7;color:var(--blue);font-size:11px;font-weight:850}.visual{margin-top:12px;padding:9px;border:1px solid var(--line);border-radius:14px;background:#fff}.visual img{display:block;width:100%;height:auto;border-radius:10px}.visual-note{font-size:11px;color:var(--muted);margin:0 0 7px}.empty{text-align:center;color:var(--muted);padding:35px 12px}.source-note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.35}.wide{grid-column:1/-1;min-height:auto}@media(max-width:480px){.screen{padding:11px}.grid{gap:8px}.card{padding:13px;min-height:118px}.qtext{font-size:17px}.otext{font-size:13px}}
</style></head><body><div id="app" class="app"></div><script src="questions.js"></script><script>
const $=s=>document.querySelector(s), app=$('#app');
const state={screen:'home'};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const stats=()=>JSON.parse(localStorage.getItem('trainerStatsV2')||'{"practiceCorrect":0,"practiceWrong":0,"tests":0,"best":0,"wrongIds":[]}');
const saveStats=s=>localStorage.setItem('trainerStatsV2',JSON.stringify(s));
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function top(title,back=true){return `<div class="topbar"><div class="row">${back?'<button class="back" onclick="goHome()">‹ Назад</button>':''}<div><div class="brand">${esc(title)}</div><div class="subtitle">ГНВП + ГОР · 145 вопросов · офлайн</div></div></div></div>`}
function goHome(){state.screen='home';renderHome()}
function renderHome(){const s=stats();app.innerHTML=top('ГНВП и ГОР — тренажёр',false)+`<div class="screen"><div class="hero"><h1>Подготовка к проверке знаний</h1><p>Вопросы и варианты ответов загружены из исходного банка без переформулировки.</p></div><div class="grid"><div class="card" onclick="openPractice()"><div class="icon">✓</div><h3>Прорешивание</h3><p>Проверка сразу. При ошибке вопрос остаётся на экране — можно решить повторно.</p></div><div class="card" onclick="openTestSettings()"><div class="icon">▦</div><h3>Тест</h3><p>Случайные вопросы. Ответы и иллюстрации раскрываются только после завершения.</p></div><div class="card" onclick="startTicket()"><div class="icon">🎫</div><h3>Билет · 10</h3><p>10 случайных вопросов из общего банка 145. Каждый билет формируется заново.</p></div><div class="card" onclick="openMistakes()"><div class="icon">↻</div><h3>Ошибки</h3><p>Повторное прорешивание вопросов, где ранее были допущены ошибки.</p></div></div><div class="section-title">Статистика</div><div class="stats"><div class="stat"><b>${s.practiceCorrect}</b><span>верно в практике</span></div><div class="stat"><b>${s.tests}</b><span>тестов / билетов</span></div><div class="stat"><b>${s.best}%</b><span>лучший результат</span></div></div><div class="source-note">Важно: порядок вариантов внутри каждого вопроса сохранён как в исходном банке. Перемешиваются только сами вопросы.</div><div class="actions"><button class="ghost" onclick="resetProgress()">Сбросить прогресс</button></div></div>`}
function resetProgress(){if(confirm('Сбросить статистику и список ошибок?')){localStorage.removeItem('trainerStatsV2');renderHome()}}
function filterQuestions(f){return f==='ALL'?QUESTIONS:QUESTIONS.filter(q=>q.domain===f)}
function settingsBlock(action,title,practice=false){return top(title)+`<div class="screen"><div class="settings"><label>Раздел</label><select id="filter"><option value="ALL">Все вопросы — ГНВП + ГОР (145)</option><option value="ГНВП">Только ГНВП (120)</option><option value="ГОР">Только ГОР (25)</option></select>${practice?'<label>Порядок</label><select id="order"><option value="SEQ">По порядку</option><option value="RND">Случайно</option></select>':`<label>Количество вопросов</label><select id="count"><option>10</option><option>20</option><option selected>25</option><option>50</option><option>100</option><option>145</option></select>`}<div class="actions"><button class="primary" onclick="${action}">Начать</button></div></div></div>`}
function openPractice(){app.innerHTML=settingsBlock('startPractice()','Прорешивание',true)}
function startPractice(ids=null){state.mode='practice';state.index=0;state.answers={};let q;if(ids){q=QUESTIONS.filter(x=>ids.includes(x.id));q=shuffle(q)}else{const f=$('#filter')?.value||'ALL';q=filterQuestions(f);if(($('#order')?.value||'SEQ')==='RND')q=shuffle(q)}state.queue=q;if(!q.length){app.innerHTML=top('Ошибки')+'<div class="screen"><div class="empty">Ошибок пока нет.</div></div>';return}renderQuestion()}
function openMistakes(){startPractice(stats().wrongIds||[])}
function openTestSettings(){app.innerHTML=settingsBlock('startTest()','Тест')}
function startTest(){state.mode='test';state.index=0;state.answers={};const f=$('#filter').value;const pool=filterQuestions(f);const n=Math.min(parseInt($('#count').value),pool.length);state.queue=shuffle(pool).slice(0,n);renderQuestion()}
function startTicket(){state.mode='ticket';state.index=0;state.answers={};state.ticketNo=Math.floor(1000+Math.random()*9000);state.queue=shuffle(QUESTIONS).slice(0,10);renderQuestion()}
function visualHtml(q){return q.image?`<div class="visual"><div class="visual-note">Справочная иллюстрация после ответа. Текст вопроса и варианты берутся только из исходного банка.</div><img src="${q.image}" alt="Иллюстрация к вопросу"></div>`:''}
function renderQuestion(){const q=state.queue[state.index];state.currentSelected=new Set(state.answers[q.id]||[]);const pct=state.index/state.queue.length*100;const opts=q.options;app.innerHTML=top(state.mode==='practice'?'Прорешивание':state.mode==='ticket'?`Билет №${state.ticketNo}`:'Тест')+`<div class="screen"><div class="qmeta"><span>${q.domain} · №${q.number}</span><span>${state.index+1} / ${state.queue.length}</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="qcard"><div class="qtext">${esc(q.question)}</div><div class="small">${q.correct.length>1?'Выберите все правильные варианты.':'Выберите один правильный вариант.'}</div><div id="options">${opts.map(o=>`<div class="option" data-id="${o.id}" onclick="toggleOption('${o.id}')"><span class="badge">${o.id}</span><span class="otext">${esc(o.text)}</span></div>`).join('')}</div><div id="feedback" class="feedback"></div><div id="visualSlot"></div><div class="actions"><button class="primary" onclick="submitCurrent()">${state.mode==='practice'?'Проверить':'Сохранить ответ'}</button>${state.mode==='practice'?'<button class="secondary" onclick="showCorrect()">Показать ответ</button>':''}</div>${state.mode!=='practice'&&state.index>0?'<div class="actions"><button class="ghost" onclick="prevQuestion()">Назад</button></div>':''}</div></div>`;paintSelection()}
function toggleOption(id){const q=state.queue[state.index];if(q.correct.length===1)state.currentSelected=new Set([id]);else state.currentSelected.has(id)?state.currentSelected.delete(id):state.currentSelected.add(id);paintSelection()}
function paintSelection(){document.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',state.currentSelected.has(el.dataset.id)))}
function sameSet(a,b){a=[...a].sort();b=[...b].sort();return a.length===b.length&&a.every((x,i)=>x===b[i])}
function selectedWrongReason(q,selected){if(q.correct.length>1)return q.wrongExplanation;const id=selected[0];const opt=q.options.find(o=>o.id===id);return opt?.feedback||q.wrongExplanation}
function showFeedback(kind,txt){const f=$('#feedback');f.className='feedback show '+kind;f.innerHTML=txt}
function markOptions(q,ok){document.querySelectorAll('.option').forEach(el=>{el.classList.remove('correct','wrong');if(ok&&q.correct.includes(el.dataset.id))el.classList.add('correct');if(!ok&&state.currentSelected.has(el.dataset.id))el.classList.add('wrong')})}
function submitCurrent(){const q=state.queue[state.index];const selected=[...state.currentSelected];if(!selected.length){showFeedback('note','Выберите вариант ответа.');return}if(state.mode==='practice'){const ok=sameSet(selected,q.correct);let s=stats();if(ok){s.practiceCorrect++;s.wrongIds=(s.wrongIds||[]).filter(id=>id!==q.id);saveStats(s);markOptions(q,true);showFeedback('good','Верно. '+esc(q.correctExplanation));$('#visualSlot').innerHTML=visualHtml(q);document.querySelector('.actions').innerHTML='<button class="primary" onclick="nextPractice()">Следующий вопрос</button>'}else{s.practiceWrong++;if(!s.wrongIds.includes(q.id))s.wrongIds.push(q.id);saveStats(s);markOptions(q,false);showFeedback('bad','Неверно. '+esc(selectedWrongReason(q,selected))+' Попробуйте ещё раз.');}return}state.answers[q.id]=selected;if(state.index<state.queue.length-1){state.index++;renderQuestion()}else finishExam()}
function showCorrect(){const q=state.queue[state.index];document.querySelectorAll('.option').forEach(el=>{if(q.correct.includes(el.dataset.id))el.classList.add('correct')});showFeedback('note','Правильный ответ показан зелёным. Можно выбрать его и проверить ещё раз.');$('#visualSlot').innerHTML=visualHtml(q)}
function nextPractice(){if(state.index<state.queue.length-1){state.index++;renderQuestion()}else app.innerHTML=top('Прорешивание')+'<div class="screen"><div class="result"><div class="score">Готово</div><p>Вы дошли до конца выбранного набора.</p><div class="actions"><button class="primary" onclick="goHome()">На главную</button></div></div></div>'}
function prevQuestion(){if(state.index>0){state.index--;renderQuestion()}}
function finishExam(){let correct=0,wrong=[];state.queue.forEach(q=>{const a=state.answers[q.id]||[];if(sameSet(a,q.correct))correct++;else wrong.push({q,a})});const pct=Math.round(correct/state.queue.length*100);let s=stats();s.tests++;s.best=Math.max(s.best||0,pct);wrong.forEach(x=>{if(!s.wrongIds.includes(x.q.id))s.wrongIds.push(x.q.id)});saveStats(s);app.innerHTML=top(state.mode==='ticket'?`Билет №${state.ticketNo}`:'Результат')+`<div class="screen"><div class="result"><div class="score">${pct}%</div><h2>${correct} из ${state.queue.length}</h2><div class="actions"><button class="primary" onclick="${state.mode==='ticket'?'startTicket()':'openTestSettings()'}">${state.mode==='ticket'?'Новый билет':'Новый тест'}</button><button class="secondary" onclick="goHome()">На главную</button></div></div>${wrong.length?`<div class="section-title">Разбор ошибок</div>${wrong.map(reviewHtml).join('')}`:'<div class="hero" style="margin-top:13px"><b>Ошибок нет.</b></div>'}</div>`}
function reviewHtml(x){const q=x.q,chosen=x.a.map(id=>q.options.find(o=>o.id===id)).filter(Boolean),corr=q.correct.map(id=>q.options.find(o=>o.id===id)).filter(Boolean);return `<div class="review-item"><span class="pill">${q.domain} · №${q.number}</span><b style="display:block;margin-top:6px">${esc(q.question)}</b><div class="small"><b>Ваш ответ:</b> ${chosen.length?chosen.map(o=>o.id+' — '+esc(o.text)).join('; '):'нет ответа'}</div><div class="small"><b>Правильно:</b> ${corr.map(o=>o.id+' — '+esc(o.text)).join('; ')}</div><div class="small" style="margin-top:5px">${esc(q.wrongExplanation)}</div>${visualHtml(q)}</div>`}
renderHome();
</script></body></html>
